<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Học web chuẩn</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Helvetica, Arial, sans-serif;
            background-color: #f8f8f8;
            color: #333;
        }

        .portfolio {
            width: 1110px;
            margin: 30px auto;
            text-align: center;
        }

        .portfolio h2 {
            font-size: 30px;
            font-weight: bold;
            color: #222;
            padding-bottom: 18px;
            margin-bottom: 35px;
            position: relative;
        }

        .portfolio h2::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 3px;
            background-color: #399;
        }

        .portfolio .list-tab {
            list-style: none;
            margin-bottom: 40px;
        }

        .portfolio .list-tab li {
            display: inline-block;
            margin: 0 14px;
        }

        .portfolio .list-tab li a {
            color: #444;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
        }

        .portfolio .list-tab li:first-child a,
        .portfolio .list-tab li a:hover {
            color: #399;
        }

        .portfolio .galerry {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            background-color: #fff;
            padding: 15px;
        }

        .portfolio .galerry li {
            width: 345px;
            margin-bottom: 22px;
        }

        .portfolio .galerry li img {
            width: 100%;
            display: block;
        }
    </style>
</head>
