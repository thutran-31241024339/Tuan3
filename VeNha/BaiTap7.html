<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài tập 7</title>
    <style>
        #wrapper {
            width: 500px;
            margin: 50px auto;
            border: 3px solid #000;
            padding: 10px;
            position: relative;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 22px;
        }

        #wrapper::before {
            content: "wrapper";
            position: absolute;
            top: -30px;
            left: 0;
        }

        header {
            border: 3px solid #000;
            height: 80px;
            margin-bottom: 12px;
            padding: 10px;
            box-sizing: border-box;
        }

        header::before {
            content: "header";
        }

        nav {
            border: 3px solid #000;
            width: 115px;
            height: 380px;
            float: left;
            padding: 10px;
            box-sizing: border-box;
        }

        nav::before {
            content: "nav";
        }

        main {
            border: 3px solid #000;
            width: 347px;
            height: 380px;
            float: right;
            margin-bottom: 12px;
            padding: 10px;
            box-sizing: border-box;
        }

        main::before {
            content: "main";
        }

        footer {
            border: 3px solid #000;
            height: 60px;
            clear: both;
            padding: 10px;
            box-sizing: border-box;
        }

        footer::before {
            content: "footer";
        }
    </style>
</head>
<body>
    <div id="wrapper">
        <header> </header>
        <nav> </nav>
        <main> </main>
        <footer> </footer>
    </div>
</body>
</html>
