<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập 2</title>
    <style>
        /* d. Lấy logo BIT với kích cỡ 30px làm hình nền lặp lại và cố định */
        body {
            background-image: url("imgs/BIT_logo.png");
            background-size: 30px;
            background-repeat: repeat;
            background-attachment: fixed;
        }

        /* a. Đại học UEH: chữ xanh, canh giữa, in đậm, gạch chân, 30 px */
        .cau-a {
            color: blue;
            text-align: center;
            font-weight: bold;
            text-decoration: underline;
            font-size: 30px;
        }

        /* b. Khoa CNTTD: chữ đỏ, canh phải, in nghiêng, có đường viền chấm màu vàng bo góc, màu nền xám, 15px, chữ mờ 50% */
        .cau-b {
            color: red;
            text-align: right;
            font-style: italic;
            border: 2px dotted yellow;
            border-radius: 10px;
            background-color: gray;
            font-size: 15px;
            opacity: 0.5;
        }

        /* c. Định dạng chữ BIT-UEH giống hình bên dùng link html-css-js.com/css/generator/text-shadow/ */
        .cau-c {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 40px;
            font-weight: bold;
            display: inline-block;
            padding: 10px 20px;
            color: #A7DD3C;
            background: #FFFFFF;
            text-shadow: 2px 0 0px #800040,
                         3px 2px 0px rgba(77,0,38,0.5),
                         3px 0 3px #FF002B,
                         5px 0 3px #800015,
                         6px 2px 3px rgba(77,0,13,0.5),
                         6px 0 9px #FF5500,
                         8px 0 9px #802A00,
                         9px 2px 9px rgba(77,25,0,0.5),
                         9px 0 18px #FFD500,
                         11px 0 18px #806A00,
                         12px 2px 18px rgba(77,66,0,0.5),
                         12px 0 30px #D4FF00,
                         14px 0 30px #6A8000,
                         15px 2px 30px rgba(64,77,0,0.5),
                         15px 0 45px #80FF00,
                         17px 0 45px #408000,
                         17px 2px 45px rgba(38,77,0,0.5);
        }

        /* e. Đoạn văn: Rộng: 100px; Cao: 50px; Ẩn nội dung khi bị tràn; Cắt nội dung bị tràn với chữ ...; white-space: nowrap; */
        .cau-e {
            width: 100px;
            height: 50px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            border: 1px solid #000;
            background-color: #fff;
        }
    </style>
</head>
<body>
    <p class="cau-a">Đại học UEH</p>

    <p class="cau-b">Khoa CNTTD</p>

    <p class="cau-c">BIT-UEH</p>

    <p class="cau-e">
        Nhu cầu xã hội Ngành Thương mại điện tử (TMĐT) tại Việt Nam hiện nay đang có những bước tăng trưởng mạnh mẽ và ngày càng đóng góp nhiều hơn cho sự phát triển kinh tế xã hội của đất nước. Thị trường TMĐT Việt Nam đã trở nên sôi động hơn khi có nhiều
    </p>
</body>
</html>
