<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài tập 4</title>
    <style>
        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            display: inline-block;
            background-color: aqua;
            width: 140px;
            padding: 5px 0;
            margin-right: 5px;
            text-align: center;
            font-size: 24px;
        }

        li a {
            color: blue;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <ul>
        <li><a href="#">TMDT</a></li>
        <li><a href="#">ERP</a></li>
        <li><a href="#">MIS</a></li>
        <li><a href="#">DS</a></li>    
    </ul>
</body>
</html>
